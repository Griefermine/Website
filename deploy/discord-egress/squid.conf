# Bot-Container und nur temporär verbundene Paket-Installationen verwenden
# unterschiedliche Proxy-Adressen und werden anhand ihrer Quellnetze getrennt.
http_port 172.30.250.1:3128 name=bot
http_port 172.30.251.1:3128 name=dependencies
http_port 127.0.0.1:3129 name=hub
http_port 127.0.0.1:3130 name=docker
http_port 127.0.0.1:3131 name=packages
acl bot_network src 172.30.250.0/24
acl dependency_network src 172.30.251.0/24
acl host_local src 127.0.0.1/32
acl bot_port myportname bot
acl dependencies_port myportname dependencies
acl hub_port myportname hub
acl docker_port myportname docker
acl packages_port myportname packages

# Discord-Bot-REST, Gateway-WebSocket und Discord-Login laufen über HTTPS.
# Ausschließlich CONNECT auf TCP 443 und Discord-Domains zulassen.
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443
acl package_http_methods method GET HEAD
acl package_http_port port 80
# dstdomain-Regel (Squid 5, offizielle Dokumentation zum Schlüsselwort
# "dstdomain"): Ein Eintrag foo.com trifft NUR den exakten Namen. Subdomains
# werden nur matched, wenn der Eintrag mit führendem Punkt (.foo.com)
# geschrieben ist – diese Form deckt zugleich den exakten Namen ab.
# Empirisch verifiziert mit Squid 5.7 (Debian bookworm): `dstdomain
# docker.io` lehnt registry-1.docker.io ab, `.docker.io` lässt beide durch.
# Deshalb führt jede dstdomain-ACL ihre Domains mit führendem Punkt.
acl discord_domains dstdomain .discord.com .discord.gg .discordapp.com .discordapp.net
acl package_domains dstdomain .registry.npmjs.org .pypi.org .files.pythonhosted.org .repo.maven.apache.org .repo1.maven.org .plugins.gradle.org .plugins-artifacts.gradle.org .services.gradle.org .downloads.gradle.org .proxy.golang.org .sum.golang.org .storage.googleapis.com .crates.io .nuget.org
acl callback_domains dstdomain "/etc/squid/callback-domains.txt"
acl metadata_ipv4 dst 100.100.100.200/32 168.63.129.16/32
acl metadata_ipv6 dst fd00:ec2::/32

# Schutz gegen versehentliche oder manipulierte Ziele auf dem Proxy.
acl private_ipv4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 255.255.255.255/32
# Achtung: ::ffff:0:0/96 (IPv4-mapped) darf hier NICHT stehen – Squid
# vergleicht IPv4-Ziele in gemappter Form, der Eintrag hätte daher ALLE
# IPv4-Ziele getroffen und jede Freigabe ausgehebelt (empirisch mit
# Squid 5.7 verifiziert: jeder CONNECT auf 403). Echtes IPv4 wird bereits
# über private_ipv4 gesperrt.
acl private_ipv6 dst ::/128 ::1/128 64:ff9b::/96 64:ff9b:1::/48 100::/64 2001::/23 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8
acl to_localhost dst 0.0.0.0/32 127.0.0.0/8 ::/128 ::1/128
acl to_linklocal dst 169.254.0.0/16 fe80::/10

http_access deny !Safe_ports
http_access deny !CONNECT !package_http_methods
http_access deny CONNECT !SSL_ports
http_access deny metadata_ipv4
http_access deny metadata_ipv6
http_access deny to_localhost
http_access deny to_linklocal
# Privatziele werden vor jeder allow-Regel verworfen: Split-DNS oder
# Rebinding kann auch eine freigegebene Domain auf ein privates Ziel stellen.
http_access deny private_ipv4
http_access deny private_ipv6
http_access allow host_local hub_port CONNECT callback_domains
http_access allow bot_network bot_port CONNECT discord_domains
http_access deny bot_network
http_access allow dependency_network dependencies_port CONNECT package_domains
http_access deny dependency_network
# production.cloudflare.docker.com liegt unter docker.com und wird von
# .docker.com bereits erfasst; mcr.microsoft.com behält seinen eigenen
# Maximal-Eintrag (kein Unterbau der beiden anderen).
acl docker_domains dstdomain .docker.io .docker.com .mcr.microsoft.com
acl distro_domains dstdomain .debian.org .ubuntu.com
acl hub_domains dstdomain .discord.com .discord.gg .letsencrypt.org
http_access allow host_local hub_port CONNECT hub_domains
http_access allow host_local docker_port CONNECT docker_domains
http_access allow host_local packages_port CONNECT package_domains
http_access allow host_local packages_port CONNECT distro_domains
http_access allow host_local packages_port package_http_methods package_http_port package_domains
http_access allow host_local packages_port package_http_methods package_http_port distro_domains
http_access deny host_local
http_access deny all

cache deny all
cache_mem 0 MB
pid_filename /tmp/squid.pid
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
